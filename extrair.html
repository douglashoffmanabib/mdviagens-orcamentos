<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Extrator de Orçamentos · MD Viagens</title>
<style>
  :root{ --navy:#16264a; --navy2:#1f3460; --gold:#c3a063; --ink:#e9ecf1; --muted:#9aa3b0; --bg:#141618; --card:#1c1f23; --line:#2a2f36; --green:#25a35a; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
  header{ background:var(--navy); display:flex; align-items:center; justify-content:space-between; padding:10px 22px; gap:16px; flex-wrap:wrap; }
  header img{ height:56px; display:block; }
  nav{ display:flex; gap:20px; align-items:center; flex-wrap:wrap; }
  nav a{ color:var(--gold); text-decoration:none; font-size:15px; }
  nav a.on{ color:#fff; font-weight:700; letter-spacing:.06em; text-transform:uppercase; }
  .wrap{ max-width:1000px; margin:34px auto; padding:0 18px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:30px; }
  h1{ margin:0 0 6px; font-size:30px; }
  .sub{ color:var(--muted); margin:0 0 22px; }
  .drop{ border:2px dashed var(--gold); background:rgba(195,160,99,.07); border-radius:12px; padding:34px; text-align:center; cursor:pointer; font-size:17px; }
  .drop:hover{ background:rgba(195,160,99,.12); }
  .opts{ margin:18px 0 14px; display:flex; flex-direction:column; gap:8px; }
  .opts label{ display:flex; align-items:center; gap:10px; font-size:16px; cursor:pointer; }
  .opts small{ color:var(--muted); }
  .campos{ display:flex; gap:14px; flex-wrap:wrap; margin-bottom:18px; }
  .campos input{ flex:1 1 240px; background:#2a2e33; border:1px solid var(--line); border-radius:10px; color:var(--ink); padding:14px 16px; font-size:15px; }
  .campos input::placeholder{ color:#8a9099; }
  button.go{ background:var(--navy2); color:#fff; border:0; border-radius:999px; padding:15px 34px; font-size:17px; font-weight:700; cursor:pointer; }
  button.go:disabled{ opacity:.5; cursor:default; }
  .status{ margin:18px 0 6px; font-weight:700; }
  .card-res{ background:#22262b; border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin-top:14px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .card-res.fail{ background:#3a1d1d; border-color:#5d2b2b; }
  .info{ flex:1 1 220px; }
  .cli{ font-weight:700; font-size:17px; }
  .meta{ color:var(--muted); font-size:13px; margin-top:3px; }
  .meta.err{ color:#ffb4b4; }
  .cod{ background:var(--gold); color:#1b1b1b; font-weight:700; border-radius:8px; padding:5px 10px; font-size:13px; }
  .btn{ display:inline-block; text-decoration:none; border:1px solid var(--line); background:#2c3138; color:var(--ink); border-radius:999px; padding:9px 16px; font-size:14px; font-weight:600; cursor:pointer; }
  .btn.p{ background:var(--gold); color:#1b1b1b; border-color:var(--gold); }
  .btn.w{ background:var(--green); color:#fff; border-color:var(--green); }
</style>
</head>
<body>
<header>
  <img src="/img/logo-md.jpg" alt="MD Viagens">
  <nav>
    <a class="on" href="/extrair.html">Orçamentos</a>
    <a href="/">Central</a>
    <a href="/voucher.html">Vouchers</a>
    <a href="/historico.html">Histórico</a>
  </nav>
</header>

<div class="wrap">
  <div class="card">
    <h1>Extrator de Orçamentos</h1>
    <p class="sub">Selecione um ou <b>vários</b> arquivos (PDF ou imagem). Cada um vira um orçamento com link curto.</p>

    <div class="drop" id="drop"><span id="dropText">Clique e escolha os orçamentos</span></div>
    <input type="file" id="file" multiple accept="application/pdf,image/png,image/jpeg,image/webp" style="display:none">

    <div class="opts">
      <label><input type="radio" name="modo" value="cada" checked> Um orçamento por arquivo</label>
      <label><input type="radio" name="modo" value="juntar"> Juntar os arquivos num orçamento só <small>(ex.: hotel + voo, ou ida + volta)</small></label>
    </div>

    <div class="campos">
      <input id="cliNome" placeholder="Nome do cliente">
      <input id="cliTel" placeholder="WhatsApp do cliente (opcional)">
    </div>

    <button class="go" id="go" disabled>Extrair e gerar links</button>

    <div class="status" id="status"></div>
    <div id="res"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let files = [];

$('drop').addEventListener('click', () => $('file').click());
$('file').addEventListener('change', () => {
  files = [...$('file').files];
  $('dropText').textContent = files.length ? files.length + ' arquivo(s) selecionado(s)' : 'Clique e escolha os orçamentos';
  $('go').disabled = !files.length;
});

function toArq(f){
  return new Promise(r => { const rd = new FileReader();
    rd.onload = () => r({ data: rd.result.split(',')[1], mime: f.type || 'application/pdf' });
    rd.readAsDataURL(f); });
}
function waLink(url, cliente, tel, destino){
  const dest = destino || 'sua viagem';
  const msg = 'Olá' + (cliente ? ' ' + cliente.split(' ')[0] : '') + '! Segue o orçamento para *' + dest + '*:\n' + url;
  let num = String(tel || '').replace(/\D/g, '');
  if (num && num.length <= 11) num = '55' + num;
  return 'https://wa.me/' + num + '?text=' + encodeURIComponent(msg);
}

function addCard(r){
  const res = $('res');
  if (r.ok) {
    const soDoc = r.tipo === 'AER' || r.tipo === 'HTL';
    const btns = [
      soDoc ? `<a class="btn p" href="${r.pdf}">BAIXAR PDF</a>` : '',
      `<a class="btn" href="${r.url}" target="_blank">ABRIR</a>`,
      !soDoc ? `<a class="btn p" href="${r.pdf}">PDF</a>` : '',
      `<button class="btn" onclick="navigator.clipboard.writeText('${r.url}');this.textContent='COPIADO'">COPIAR LINK</button>`,
      `<a class="btn w" href="${r.wa}" target="_blank">WHATSAPP</a>`
    ].filter(Boolean).join(' ');
    res.insertAdjacentHTML('beforeend', `<div class="card-res">
      <div class="info"><div class="cli">${r.cliente || 'Orçamento'}</div>
      <div class="meta">${r.arquivo}${soDoc ? ' · entrega em PDF' : ' · link + PDF'}</div></div>
      <span class="cod">${r.codigo || ''}</span> ${btns}</div>`);
  } else {
    res.insertAdjacentHTML('beforeend', `<div class="card-res fail"><div class="info">
      <div class="cli">Falhou: ${r.arquivo}</div><div class="meta err">${r.erro}</div></div></div>`);
  }
}

async function gerar(arquivos, label){
  try{
    const r = await fetch('/api/extract', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ arquivos }) });
    const j = await r.json();
    if (!r.ok) { addCard({ ok:false, arquivo:label, erro:(j.error || ('erro ' + r.status)) + (j.detail ? ' — ' + j.detail : '') }); return; }

    const cn = ($('cliNome').value || '').trim();
    const ct = ($('cliTel').value || '').trim();
    if (cn || ct) { j.data.cliente = j.data.cliente || {}; if (cn) j.data.cliente.nome = cn; if (ct) j.data.cliente.telefone = ct; }

    let id, codigo, tipo;
    try {
      const sr = await fetch('/api/save', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ data: j.data }) });
      if (sr.ok) { const s = await sr.json(); id = s.id; codigo = s.codigo; tipo = s.tipo; }
    } catch(e){}

    let url, pdf;
    if (id) { url = location.origin + '/o/' + id; pdf = location.origin + '/api/pdf?id=' + encodeURIComponent(id); }
    else {
      const b = btoa(unescape(encodeURIComponent(JSON.stringify(j.data))));
      url = location.origin + '/orcamento.html#' + b; pdf = url;
    }
    if (!tipo && codigo) tipo = String(codigo).slice(0,3);

    const cliente = (j.data.cliente && j.data.cliente.nome) || cn || '';
    const tel = (j.data.cliente && j.data.cliente.telefone) || ct || '';
    const destino = j.data.destinoMensagem || j.data.destinoResumo || '';
    addCard({ ok:true, arquivo:label, cliente, codigo, tipo, url, pdf, wa: waLink(soDocLink(tipo) ? pdf : url, cliente, tel, destino) });
  } catch(e){
    addCard({ ok:false, arquivo:label, erro:String(e) });
  }
}
const soDocLink = t => t === 'AER' || t === 'HTL';

$('go').addEventListener('click', async () => {
  if (!files.length) return;
  $('go').disabled = true; $('res').innerHTML = ''; $('status').textContent = 'Lendo os documentos…';
  const modo = document.querySelector('input[name=modo]:checked').value;
  try{
    if (modo === 'juntar') {
      const arquivos = await Promise.all(files.map(toArq));
      await gerar(arquivos, files.map(f => f.name).join(' + '));
      $('status').textContent = '✔ Concluído — 1 orçamento (arquivos juntados).';
    } else {
      for (const f of files) { const a = await toArq(f); await gerar([a], f.name); }
      $('status').textContent = '✔ Concluído — ' + files.length + ' orçamento(s).';
    }
  } catch(e){ $('status').textContent = 'Falha: ' + e; }
  $('go').disabled = false;
});
</script>
</body>
</html>
