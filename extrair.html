<title>Extrator de Orçamentos · MD Viagens</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:#eef1f6;color:#1f2937;margin:0;padding:0}
  .topbar{background:#16264a;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 26px}
  .topbar .logo{height:60px}
  .topbar .tt{color:#fff;font-size:15px;font-weight:600;letter-spacing:2px;text-transform:uppercase;opacity:.85}
  .topbar .tt a{color:#c3a063;text-decoration:none;margin-left:16px;font-size:13px;letter-spacing:.3px;text-transform:none}
  .page{padding:28px 18px}
  .box{max-width:820px;margin:0 auto;background:#fff;border:1px solid #e6e9ef;border-radius:14px;padding:26px;box-shadow:0 1px 3px rgba(16,24,40,.05)}
  @media(max-width:560px){.topbar .logo{height:44px}.topbar .tt{font-size:12px}}
  h1{color:#16264a;font-size:22px;margin:0 0 4px}
  p{color:#6b7280;font-size:14px;margin:0 0 18px}
  p a{color:#16264a;font-weight:700}
  .drop{border:2px dashed #c3a063;border-radius:12px;padding:26px;text-align:center;background:#faf6ea;cursor:pointer;display:block}
  .drop input{display:none}
  .btn{border:none;border-radius:30px;padding:11px 22px;font-size:14.5px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;color:#fff}
  .btn:disabled{opacity:.5;cursor:default}
  .go{background:#16264a;margin-top:16px}
  .status{margin-top:14px;font-size:14px;color:#16264a;font-weight:600}
  .err{color:#b42318}
  .res{margin-top:18px}
  .card{background:#f7f9fc;border:1px solid #e6e9ef;border-radius:12px;padding:12px 14px;margin-bottom:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .card.fail{background:#fdf1f0;border-color:#f3c9c4}
  .card .info{flex:1;min-width:180px}
  .card .cli{font-weight:700;color:#16264a;font-size:14.5px}
  .card .meta{font-size:12px;color:#6b7280;margin-top:2px}
  .card .cod{font-family:ui-monospace,monospace;font-size:11.5px;color:#a8863f;background:#faf6ea;border:1px solid #e5d6b0;padding:2px 8px;border-radius:6px}
  .abrir{background:#16264a}.wpp{background:#25D366}.copiar{background:#c3a063}.pdf{background:#8b1e3f}
  .mini{font-size:12.5px;padding:8px 14px}
  .modo{margin-top:14px;display:flex;flex-direction:column;gap:8px}
  .modo label{font-size:13.5px;color:#26303f;cursor:pointer;display:flex;align-items:center;gap:8px}
  .modo label span{color:#6b7280;font-size:12px}
  .cli{margin-top:12px;display:flex;gap:10px;flex-wrap:wrap}
  .cli input{flex:1;min-width:180px;padding:10px 12px;border:1px solid #e6e9ef;border-radius:10px;font-size:14px}
</style></head>

      <label><input type="radio" name="modo" value="cada" checked> Um orçamento por arquivo</label>
      <label><input type="radio" name="modo" value="juntar"> Juntar os arquivos num orçamento só <span>(ex.: hotel + voo, ou ida + volta)</span></label>
    </div>
    <div class="cli">
      <input type="text" id="cliNome" placeholder="Nome do cliente">
      <input type="text" id="cliTel" placeholder="WhatsApp do cliente (opcional)">
    </div>
    <button class="btn go" id="go" disabled>Extrair e gerar links</button>
    <div class="status" id="status"></div>
    <div class="res" id="res"></div>
  </div>
  </div>
<script>
const fileEl=document.getElementById('file'), go=document.getElementById('go'),
      statusEl=document.getElementById('status'), res=document.getElementById('res'),
      dropText=document.getElementById('dropText');
let files=[];
fileEl.addEventListener('change',()=>{
  files=[...fileEl.files];
  if(!files.length){go.disabled=true;dropText.textContent='📄 Clique aqui e escolha os PDFs (pode selecionar vários)';return;}
  dropText.textContent='📄 '+files.length+' arquivo(s) selecionado(s)';
  go.disabled=false;
});
function toArquivo(file){return new Promise(r=>{const rd=new FileReader();rd.onload=()=>r({data:rd.result.split(',')[1], mime:file.type||'application/pdf'});rd.readAsDataURL(file);});}
function waLink(url,cliente,tel,destino){
  const dest=(destino||'').trim();
  const linha1 = dest ? `Segue o orçamento para *${dest}*:` : 'Segue o seu orçamento de viagem:';
  const msg=`Olá${cliente?', '+cliente:''}! 😊 ${linha1}\n${url}\n\nQualquer dúvida, é só me chamar!\nGabriela · MD Viagens`;
  let num=(tel||'').replace(/\D/g,'');
  if(num && num.length<=11) num='55'+num; // adiciona DDI Brasil quando faltar
  return 'https://wa.me/'+num+'?text='+encodeURIComponent(msg);
}
function addCard(r){
  if(r.ok){
    // Pacote (PCT) = link HTML + PDF opcional | Só voo (AER) ou só hotel (HTL) = PDF é a entrega
    const soDoc = /^(AER|HTL)/.test(r.codigo||'');
    const botoes = soDoc
      ? `<a class="btn mini pdf" href="${r.pdf}">BAIXAR PDF</a>
         <a class="btn mini wpp" href="${r.wa}" target="_blank">WhatsApp</a>
         <a class="btn mini abrir" href="${r.url}" target="_blank">Ver online</a>`
      : `<a class="btn mini abrir" href="${r.url}" target="_blank">Abrir ↗</a>
         <a class="btn mini wpp" href="${r.wa}" target="_blank">WhatsApp</a>
         <a class="btn mini pdf" href="${r.pdf}">PDF</a>
         <button class="btn mini copiar" onclick="navigator.clipboard.writeText('${r.url}');this.textContent='Copiado!'">Copiar</button>`;
    res.insertAdjacentHTML('beforeend',`<div class="card">
      <div class="info"><div class="cli">${r.cliente||'Orçamento'}</div><div class="meta">${r.arquivo}${soDoc?' · entrega em PDF':' · link + PDF'}</div></div>
      <span class="cod">${r.codigo||''}</span>
      ${botoes}
    </div>`);
  }else{
    res.insertAdjacentHTML('beforeend',`<div class="card fail"><div class="info"><div class="cli">Falhou: ${r.arquivo}</div><div class="meta err">${r.erro}</div></div></div>`);
  }
}
async function gerar(arquivos,label){
  try{
    const r=await fetch('/api/extract',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({arquivos})});
    const j=await r.json();
    if(!r.ok){ addCard({ok:false,arquivo:label,erro:j.error||('erro '+r.status)}); return; }
    // nome/telefone do cliente informados na tela sobrescrevem o extraído
    const cn=(document.getElementById('cliNome').value||'').trim();
    const ct=(document.getElementById('cliTel').value||'').trim();
    if(cn||ct){ j.data.cliente=j.data.cliente||{}; if(cn)j.data.cliente.nome=cn; if(ct)j.data.cliente.telefone=ct; }
    let id,codigo;
    try{ const sr=await fetch('/api/save',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({data:j.data})}); if(sr.ok){const s=await sr.json(); id=s.id; codigo=s.codigo;} }catch(e){}
    let url,pdf;
    if(id){ url=location.origin+'/o/'+id; pdf=location.origin+'/api/pdf?id='+encodeURIComponent(id); }
    else { const b=btoa(unescape(encodeURIComponent(JSON.stringify(j.data)))); url=location.origin+'/orcamento.html#'+b; pdf=location.origin+'/orcamento.html?print=1#'+b; }
    const cliente=(j.data.cliente&&j.data.cliente.nome)||'';
    const tel=(j.data.cliente&&j.data.cliente.telefone)||'';
    const destino=j.data.destinoMensagem||j.data.destinoResumo||'';
    addCard({ok:true,arquivo:label,cliente,codigo:codigo||(j.data.codigo||''),url,pdf,wa:waLink(url,cliente,tel,destino)});
  }catch(e){ addCard({ok:false,arquivo:label,erro:String(e)}); }
}
go.addEventListener('click',async()=>{
  if(!files.length)return;
  go.disabled=true; res.innerHTML=''; statusEl.className='status';
  const modo=(document.querySelector('input[name=modo]:checked')||{}).value||'cada';
  if(modo==='juntar'){
    statusEl.textContent=`Lendo e juntando ${files.length} arquivo(s) num orçamento só…`;
    const arqs=await Promise.all(files.map(toArquivo));
    await gerar(arqs, files.map(f=>f.name).join(' + '));
    statusEl.textContent='✔ Concluído — 1 orçamento (arquivos juntados).';
  }else{
    let done=0;
    for(const f of files){
      done++; statusEl.textContent=`Processando ${done}/${files.length}: ${f.name}…`;
      const a=await toArquivo(f); await gerar([a], f.name);
    }
    statusEl.textContent=`✔ Concluído — ${done} orçamento(s).`;
  }
  go.disabled=false;
});
</script>
</body></html>
