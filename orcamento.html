<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orçamento · MD Viagens</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&family=Playfair+Display:ital,wght@0,600;1,500;1,600&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0e1c42;--navy2:#16295c;--gold:#e0a52e;--gold-d:#c98f1e;
    --teal:#3a7ca5;--ink:#26303f;--muted:#6b7280;--line:#e6e9ef;--bg:#eef1f6;
    --card:#fff;--green:#25d366;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5}
  a{color:inherit;text-decoration:none}img{display:block}

  /* HEADER — capa de marca centralizada + barra utilitária + navegação */
  .topo{background:var(--navy)}
  .topo-brand{max-width:900px;margin:0 auto;padding:38px 24px 24px;text-align:center}
  .topo-brand .logo{height:104px;width:auto;margin:0 auto;display:block}
  .topo-brand .tagline{color:#e7ebf5;font-size:15px;margin-top:16px;font-weight:500}
  .topo-brand .tagline b{color:var(--gold);font-weight:700}
  .topo-brand .titulo{color:#fff;font-size:29px;font-weight:800;letter-spacing:2.2px;text-transform:uppercase;margin-top:14px;font-family:'Poppins',sans-serif}
  .topo-row2{max-width:1140px;margin:0 auto;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px 20px;padding:16px 24px 12px;border-top:1px solid rgba(255,255,255,.14);text-align:center}
  .topo-contato{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:9px 14px;font-size:13.5px;color:#c9d3e2;width:100%}
  .topo-contato .wpp2{display:inline-flex;align-items:center;gap:7px;color:#fff;font-weight:700}
  .topo-contato .wpp2 svg{width:17px;height:17px;flex:0 0 auto}
  .topo-contato .sep{opacity:.4}
  .topo-cadastur-bar{background:#000;display:flex;align-items:center;justify-content:center;gap:8px;padding:6px 16px;font-size:11px;color:#c9d3e2;text-align:center}
  .topo-cadastur-bar img{height:15px;width:auto;flex:0 0 auto}
  @media(max-width:640px){.topo-brand .logo{height:70px}.topo-brand .titulo{font-size:19px;letter-spacing:1.2px}.topo-brand .tagline{font-size:12.5px}.topo-cadastur-bar{font-size:10px;padding:6px 10px}}

  /* NAV — abaixo da foto, sobre o fundo claro da página */
  .nav{position:sticky;top:0;z-index:1200;background:#fff;color:var(--navy);display:flex;align-items:center;padding:0 12px;box-shadow:0 2px 10px rgba(16,24,40,.08);border-bottom:1px solid var(--line)}
  .nav .menu{max-width:1100px;margin:0 auto;width:100%;display:flex;justify-content:center;overflow-x:auto}
  .nav a.link{padding:14px 16px;font-size:13px;font-weight:600;color:var(--navy);opacity:.65;border-bottom:2px solid transparent;transition:.2s;white-space:nowrap}
  .nav a.link:hover,.nav a.link.active{opacity:1;border-color:var(--gold)}

  /* BANNER DA VIAGEM — foto de capa em largura total, logo abaixo do menu */
  .hero-banner{position:relative;min-height:300px;display:flex;align-items:flex-end;color:#fff;overflow:hidden}
  .hero-slide{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.6s ease}
  .hero-slide.active{opacity:1}
  .hero-banner::after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(14,28,66,0) 0%,rgba(14,28,66,0) 40%,rgba(14,28,66,.14) 62%,rgba(14,28,66,.88) 100%)}
  .hero-banner-inner{position:relative;z-index:2;max-width:1140px;margin:0 auto;width:100%;padding:26px 24px 32px}
  .hero-rota{font-size:34px;font-weight:800;font-family:'Poppins',sans-serif;text-shadow:0 2px 10px rgba(0,0,0,.35)}
  .hero-info{margin-top:10px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:14.5px;font-weight:500;opacity:.95}
  .hero-info .div{opacity:.4}
  @media(max-width:640px){.hero-banner{min-height:210px}.hero-rota{font-size:22px}.hero-info{font-size:12.5px}}

  .sec-head h2{font-family:'Poppins',sans-serif}
  .pdfbtn{position:fixed;bottom:18px;right:18px;z-index:2000;background:#e0a52e;color:#0e1c42;border:none;border-radius:22px;padding:9px 16px;font-size:12px;font-weight:800;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.22)}
  @media print{ .nav,.topo-row2,.topo-pdf-row,.topo-cadastur-bar,.pdfbtn{display:none!important} #hotelmap,.minimap{display:none!important} section{break-inside:avoid} }
  /* ===== Cotação de Voos (só-voo, estilo documento) ===== */
  .vpage{background:#fff;min-height:100vh}
  .vbar{background:#0e1c42;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:14px 28px;font-weight:800;letter-spacing:.5px}
  .vbar .vbar-r{color:#e0a52e;font-weight:600;font-size:14px}
  .vwrap{max-width:900px;margin:0 auto;padding:26px 28px}
  .vhead{display:flex;gap:22px;align-items:flex-start;margin-bottom:20px}
  .vlogo{width:150px;height:auto;border-radius:6px;flex:0 0 auto}
  .vtitle{color:#0e1c42;font-size:30px;font-weight:800;margin:0 0 8px}
  .vsub{color:#5a6472;font-size:14px;margin-top:3px}.vsub b{color:#26303f}
  .vsec{color:#0e1c42;font-size:16px;font-weight:800;margin:22px 0 10px;border-bottom:2px solid #eef1f6;padding-bottom:5px}
  .vtable{width:100%;border-collapse:collapse;font-size:13px}
  .vtable th{background:#0e1c42;color:#fff;padding:8px 10px;text-align:center;font-size:12px}
  .vtable td{border:1px solid #e6e9ef;padding:9px 10px;text-align:center;color:#26303f}
  .vtable .c-cia img{height:26px;vertical-align:middle}
  .vnote{font-size:12.5px;color:#6b7280;margin-top:8px}
  .vval{font-size:15px;color:#26303f;display:flex;justify-content:space-between;max-width:420px}.vval b{color:#0e1c42;font-size:18px}
  .vcond{margin:2px 0 0;padding-left:18px}.vcond li{font-size:13px;color:#4a5568;margin-bottom:8px;line-height:1.5}
  .vcontact{margin-top:22px;font-size:13.5px;color:#26303f}.vcontact a{color:#0e1c42;font-weight:700}
  .vfoot{background:#0e1c42;color:#e0a52e;text-align:center;padding:14px;font-weight:700;font-size:14px}
  .vfotos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:6px}
  .vfotos img{width:100%;height:92px;object-fit:cover;border-radius:8px}
  .vhotel-nome{font-size:18px;font-weight:800;color:#0e1c42;margin-top:4px}
  .vhotel-nome .stars{color:#e0a52e;font-size:14px}
  .vpay{background:linear-gradient(135deg,#0e1c42,#16295c);color:#fff;border-radius:12px;padding:18px 20px}
  .vpay-h{font-size:16px;font-weight:800;margin-bottom:8px}
  .vpay-l{font-size:14px;font-weight:700;margin-bottom:4px}
  .vpay-l span{font-size:11.5px;font-weight:500;opacity:.85}
  .vpay-t{font-size:11.5px;opacity:.85;margin-top:10px}
  @media(max-width:640px){.vfotos{grid-template-columns:1fr 1fr}.vfotos img{height:110px}}
  @media(max-width:640px){.vtable{font-size:11px}.vtable th,.vtable td{padding:6px 5px}.vlogo{width:96px}.vtitle{font-size:22px}}

  .wrap{max-width:1000px;margin:0 auto;padding:24px 20px 50px}
  section{scroll-margin-top:60px;margin-bottom:34px}
  #experiencias,#informacoes{scroll-margin-top:60px}
  .sec-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .sec-head .ic{color:var(--navy);display:inline-flex;align-items:center;justify-content:center;opacity:.85}
  .sec-head .ic svg{width:23px;height:23px}
  .sec-head h2{font-size:19px;font-weight:700;color:var(--navy)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(16,24,40,.04)}

  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
  .stat .k{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .stat .v{font-size:16px;font-weight:700;color:var(--navy);margin-top:3px}

  /* FLIGHT */
  .fl{margin-bottom:14px}
  .fl-top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:11px 16px;background:#f4f7fb;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
  .fl-top b{color:var(--navy);font-size:14px}
  .flight-head{display:flex;align-items:center;gap:12px;padding:11px 16px;color:#fff;font-weight:700;flex-wrap:wrap}
  .flight-head.ida{background:var(--teal)}
  .flight-head.volta{background:var(--gold-d)}
  .flight-head .fh-tipo{font-weight:800;letter-spacing:.5px}
  .flight-head .fh-data{font-size:12.5px;font-weight:700;background:rgba(255,255,255,.22);padding:2px 10px;border-radius:12px}
  .flight-head .airports{display:flex;align-items:center;gap:12px;font-size:14px;margin-left:auto}
  .conn{background:#eef4f8;color:#2b5f7e;font-size:12.5px;padding:9px 16px;border-bottom:1px solid var(--line)}
  .leg{display:grid;grid-template-columns:96px repeat(4,1fr);gap:10px;padding:13px 16px;align-items:center;font-size:14px}
  .leg .airline{font-weight:700;color:var(--navy)}
  .airlogo{height:26px;width:auto;max-width:96px;object-fit:contain;display:block;margin-bottom:3px}
  .leg .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;display:block}
  .bag{color:var(--muted);font-size:13px;padding:0 16px 12px}
  .divider{height:1px;background:var(--line)}

  /* CAROUSEL */
  .carousel{position:relative;background:#000}
  .carousel .track{display:flex;transition:transform .35s ease}
  .carousel .track img{width:100%;aspect-ratio:16/9;object-fit:cover;flex:0 0 100%}
  .carousel button{position:absolute;top:50%;transform:translateY(-50%);border:none;background:rgba(0,0,0,.45);color:#fff;width:38px;height:38px;border-radius:50%;font-size:18px;cursor:pointer}
  .carousel .prev{left:10px}.carousel .next{right:10px}
  .carousel .dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:6px}
  .carousel .dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.5);cursor:pointer}
  .carousel .dots i.on{background:#fff}
  .src-note{font-size:11px;color:var(--muted);padding:6px 16px;background:#f4f7fb;border-bottom:1px solid var(--line)}

  .hotel-body{padding:16px 18px}
  .hotel-body h3{color:var(--navy);font-size:19px}
  .stars{color:var(--gold);font-size:14px}
  .addr{font-size:13px;color:var(--muted);margin:3px 0 12px}
  .rooms{width:100%;border-collapse:collapse;font-size:13.5px}
  .rooms th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line)}
  .rooms td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
  .pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:12px}
  .pill.green{background:#e7f6ee;color:var(--green)}.pill.orange{background:#fbeee0;color:var(--gold-d)}

  /* TRIPADVISOR REVIEWS */
  .ta{border-top:1px solid var(--line);padding:14px 18px;background:#fbfcfe}
  .ta-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .ta-score{font-size:26px;font-weight:800;color:var(--navy)}
  .ta-bubbles{color:#00aa6c;font-size:15px;letter-spacing:1px}
  .ta-head .cnt{font-size:12.5px;color:var(--muted)}
  .ta-live{margin-left:auto;font-size:11px;background:#e7f6ee;color:#00794f;border:1px solid #b7e4c9;padding:3px 8px;border-radius:10px}
  .review{border-top:1px dashed var(--line);padding:9px 0;font-size:13.5px}
  .review .who{font-weight:700;color:var(--navy);font-size:13px}
  .review .b{color:#00aa6c;font-size:12px}

  /* TRANSFER */
  .trf{display:flex;gap:14px;align-items:center;padding:15px 18px}
  .trf .ic2{color:var(--navy);opacity:.55;flex:0 0 auto;display:flex}
  .ic2 svg{width:25px;height:25px}
  .trf h4{color:var(--navy);font-size:15px}.trf p{font-size:13px;color:var(--muted)}

  /* INSURANCE */
  .ins{display:flex;gap:16px;align-items:center;padding:15px 18px}
  .ins .badge{background:#e2231a;color:#fff;font-weight:800;border-radius:8px;padding:11px 13px;font-size:12px;text-align:center;line-height:1.1}
  .ins h4{color:var(--navy);font-size:15px}.ins p{font-size:13px;color:var(--muted)}
  .tiny{font-size:11.5px;color:var(--muted);line-height:1.55}
  .disclaimer-item{font-size:11.5px;color:var(--muted);font-style:italic;margin-top:8px;line-height:1.5}
  .aviso-retirada{color:#c0392b;font-size:12px;line-height:1.5;margin-top:10px}
  .aviso-retirada b{font-weight:700}
  .btn-retirar{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid #c0392b;color:#c0392b;font-size:11.5px;font-weight:700;padding:5px 12px;border-radius:16px;margin-top:6px}
  .btn-retirar:hover{background:#fdecea}

  /* MAPS */
  .map-card{padding:12px 10px 8px}
  .map-card .cap{text-align:center;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:2px}
  .map-card svg{width:100%;height:auto;max-width:430px;display:block;margin:0 auto}
  #hotelmap{height:300px;width:100%;border-radius:0 0 14px 14px;z-index:1}
  .map-split{display:grid;gap:12px;margin-bottom:12px}
  .map-split.two{grid-template-columns:1fr 1fr}
  .map-split.one{grid-template-columns:1fr}
  .mini .cap{text-align:center;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;padding:10px 8px}
  .minimap{height:260px;width:100%;z-index:1}
  .leaflet-tooltip.maptip{background:#fff;border:1px solid var(--line);color:var(--navy);font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;box-shadow:0 1px 3px rgba(0,0,0,.18)}
  .leaflet-tooltip.maptip::before{display:none}
  @media(max-width:760px){.map-split.two{grid-template-columns:1fr}}

  /* PRICE (discreto) */
  .price{padding:18px}
  .price .row{display:flex;justify-content:space-between;font-size:14px;padding:6px 0;border-bottom:1px solid var(--line);color:var(--ink)}
  .price .row.total{border:none;padding-top:12px;font-size:16px;font-weight:800;color:var(--navy)}
  .price .row.total .amt{font-size:19px}
  .pay{margin-top:12px;background:#f4f7fb;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13.5px}
  .pay b{color:var(--navy)}
  .note{display:flex;gap:8px;font-size:12.5px;color:var(--muted);margin-top:10px}
  /* Forma de Investimento — bloco azul */
  .invest-blue{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:24px;border-radius:14px}
  .inv-h{font-family:'Poppins',sans-serif;font-size:21px;font-weight:800;color:#f4923b;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid rgba(255,255,255,.15)}
  .inv-h b{color:#fff;font-weight:900}
  .inv-parcelas-simple{display:flex;flex-direction:column;gap:7px}
  .ip-line{font-family:'Poppins',sans-serif;font-size:16.5px;font-weight:700;color:#fff}
  .ip-detalhe{font-size:12px;font-weight:400;opacity:.6}
  .inv-total{font-size:12.5px;opacity:.85;margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,.15)}
  .inv-total b{font-size:14px}
  .inv-rodape{font-size:11.5px;opacity:.6;margin-top:8px;font-style:italic}
  .mod-box{margin-top:20px;text-align:center}
  .mod-t{font-family:'Poppins',sans-serif;font-size:19px;font-weight:700;color:var(--navy);margin-bottom:14px}
  .mod-btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
  .mod-btn{background:var(--gold);color:var(--navy);border-radius:24px;padding:12px 20px;font-size:13px;font-weight:800;letter-spacing:.4px;text-decoration:none;transition:.2s;box-shadow:0 2px 8px rgba(224,165,46,.35)}
  .mod-btn:hover{background:var(--gold-d);color:#fff}
  /* Condições no rodapé */
  .condicoes{max-width:1000px;margin:0 auto;padding:6px 20px 26px}
  .aviso-roteiro-bar{background:#000;color:#e8ebf2;text-align:center;font-size:11.5px;line-height:1.6;padding:8px 16px}
  .aviso-roteiro-tag{background:var(--gold);color:#1b1b1b;font-weight:800;font-size:10px;letter-spacing:.4px;padding:2px 7px;border-radius:4px;display:inline-block;vertical-align:middle;margin-right:7px}
  .extra-fotos{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
  .extra-fotos img{width:84px;height:64px;object-fit:cover;border-radius:8px;display:block}
  .revert-banner{background:#f4923b;color:#1b1b1b;text-align:center;padding:14px 16px}
  .revert-banner .rb-title{font-family:'Poppins',sans-serif;font-weight:800;font-size:14.5px;letter-spacing:.3px}
  .revert-banner .rb-sub{font-size:12px;margin-top:4px;opacity:.85}
  .condicoes h4{font-size:12px;color:var(--navy);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
  .condicoes p{font-size:11.5px;color:var(--muted);line-height:1.6;margin-bottom:6px}
  .invest-total b{color:var(--navy);font-size:13px}

  /* CONTACT */
  .contact{padding:22px;text-align:center}
  .contact h3{color:#c0392b;font-size:24px;font-weight:800;margin-bottom:8px}
  .contact p{color:#c0392b;font-size:15px;max-width:460px;margin:0 auto 14px}
  .btn{display:inline-block;background:var(--green);color:#fff;padding:16px 38px;border-radius:34px;font-weight:800;font-size:17px;box-shadow:0 5px 16px rgba(37,211,102,.4)}
  .agent-line{margin-top:16px;font-size:13px;color:var(--muted)}
  .agent-line b{color:var(--navy)}
  .socials{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:16px}
  .ig{display:flex;align-items:center;gap:9px;background:linear-gradient(135deg,#fdf2f8,#f3ecfb);border:1px solid #ecd7ee;border-radius:12px;padding:8px 14px;text-align:left}
  .ig .ig-ico{width:26px;height:26px;flex:0 0 auto}
  .ig b{color:var(--navy);font-size:13.5px;display:block}
  .ig small{color:var(--muted);font-size:11.5px}
  .pillars{display:grid;grid-template-columns:repeat(4,1fr)}
  .pillar{padding:22px 20px;border-right:1px solid var(--line)}
  .pillar:last-child{border-right:none}
  .pillar h4{font-family:'Poppins',sans-serif;font-size:14.5px;color:var(--navy);font-weight:600;margin-bottom:7px}
  .pillar h4::before{content:"";display:block;width:26px;height:2px;background:var(--gold);margin-bottom:11px}
  .pillar p{font-size:12.5px;color:var(--muted);line-height:1.55}
  @media(max-width:760px){.pillars{grid-template-columns:1fr 1fr}.pillar{border-bottom:1px solid var(--line)}.pillar:nth-child(2n){border-right:none}}
  .about{padding:20px}
  .about p{font-size:14.5px;color:#374151;margin-bottom:11px;line-height:1.6}
  .about p:last-child{margin-bottom:0}

  /* FOOTER partners */
  .partners{background:#fff;border-top:1px solid var(--line);padding:22px 20px}
  .partners .lbl{text-align:center;font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:14px}
  .partners .row{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:26px}
  .partners .row img{height:30px;filter:grayscale(1);opacity:.75;transition:.2s}
  .partners .row img:hover{filter:none;opacity:1}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:18px;background:var(--navy);color:#c9d3e2}

    .grid{grid-template-columns:1fr 1fr}

     API_BASE  = URL do seu backend na Vercel (ex.: "https://md-orcamentos.vercel.app")
     hotelCode = código do hotel na Hotelbeds (vem na própria reserva/cotação)  */
const CONFIG={ API_BASE:"", hotelCode:"" }; // vazio = usa o próprio endereço do site (funciona em qualquer projeto)

/* ============ RENDER ============ */
// Se vier dados na URL (#base64 do JSON do extrator), usa eles; senão usa o exemplo acima.
let INJECTED=null;
try{ if(location.hash.length>1){ INJECTED=JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(1))))); } }catch(e){ console.warn('hash inválido',e); }
const D=INJECTED||ORCAMENTO;
// Fallbacks de imagem quando a cotação não trouxe fotos (até o Hotelbeds preencher):
const _FOTOS_PADRAO=[

const _TEM_VOO = !!(D.voos && D.voos.length && D.voos[0] && D.voos[0].trechos && D.voos[0].trechos.length);

D.hoteis = (Array.isArray(D.hoteis) && D.hoteis.length) ? D.hoteis.filter(h=>h&&h.nome)
         : ((D.hotel && D.hotel.nome) ? [D.hotel] : []);
if(D.hoteis.length) D.hotel = D.hoteis[0];
const _TEM_HOTEL = D.hoteis.length > 0;
// tipo: 'voo' (só aéreo) | 'hotel' (só hospedagem) | 'pacote' (os dois)
const _TIPO = (_TEM_VOO && !_TEM_HOTEL) ? 'voo' : ((_TEM_HOTEL && !_TEM_VOO) ? 'hotel' : 'pacote');

D.hoteis.forEach(h=>{

function buildFlights(list){
  return list.map(f=>{
    const legs=f.trechos.map(t=>`
      <div class="flight-head ${t.tipo}">
        <span class="fh-tipo">${t.tipo==='ida'?'🛫 IDA':'🛬 VOLTA'}</span>
        <span class="fh-data">${t.data}</span>
        <div class="airports"><span>${t.deCidade} · ${t.de}</span><span>→</span><span>${t.paraCidade} · ${t.para}</span></div>
      </div>
      ${t.conexao?`<div class="conn">ℹ️ ${t.conexao}</div>`:''}
      <div class="leg">
        <div class="airline">${t.iata?`<img class="airlogo" src="https://pics.avs.io/120/40/${t.iata}.png" alt="${t.cia}" onerror="this.style.display='none'">`:''}<span class="lbl">${t.cia}</span></div>
        <div><b>${t.saida}</b><span class="lbl">Saída · ${t.data}</span></div>
        <div><b>${t.dur}</b><span class="lbl">Duração</span></div>
        <div><b>${t.chegada}</b><span class="lbl">Chegada · ${t.dataChegada||t.data}</span></div>
        <div><b>${t.classe}</b><span class="lbl">Classe</span></div>
      </div><div class="divider"></div><div class="bag">🧳 ${t.bagagem}${t.aeronave?` &nbsp;·&nbsp; ✈️ ${t.aeronave}`:''}</div>`).join("");
    return `<div class="card fl"><div class="fl-top"><b>${f.rota}</b> · ${f.viajantes}</div>${legs}</div>`;
  }).join("");
}

function buildHotel(h, idx){
  if(!h||!h.nome) return '';
  idx = idx||0;
  h.fotos=h.fotos||[]; h.quartos=h.quartos||[];
  const slides=h.fotos.map(s=>`<img src="${s}" alt="${h.nome}">`).join("");
  const dots=h.fotos.map((_,i)=>`<i class="${i===0?'on':''}" data-i="${i}"></i>`).join("");
  const rooms=h.quartos.map(q=>`<tr><td><b>${q.nome}</b><br><span style="color:var(--muted)">${q.ocupacao}</span></td><td>${q.plano}</td><td><span class="pill ${q.cor}">${q.restricao}</span></td></tr>`).join("");
  const ta=h.tripadvisor||{};
  const reviews=(ta.resenhas||[]).map(r=>`<div class="review"><span class="who">${r.who}</span> <span class="b">${bubbles(r.bolhas)}</span><br>${r.txt}</div>`).join("");
  const taBlock = ta.nota ? `<div class="ta">
      <div class="ta-head"><span class="ta-score">${Number(ta.nota).toFixed(1)}</span>
        <span class="ta-bubbles">${bubbles(ta.nota)}</span>
        <span class="cnt">${ta.avaliacoes?Number(ta.avaliacoes).toLocaleString('pt-BR')+' avaliações':'avaliações'}</span></div>
    </div>` : '';
  return `<div class="card">
    ${h.cidade?`<div class="fl-top"><b>${h.cidade}</b>${h.checkin&&h.checkout?` · ${h.checkin} a ${h.checkout}`:''}${h.noites?` · ${h.noites} noites`:''}</div>`:''}
    <div class="carousel" id="carousel${idx}" data-idx="${idx}">
      <div class="track">${slides}</div>
      <button class="prev" onclick="slide(-1,${idx})">‹</button><button class="next" onclick="slide(1,${idx})">›</button>
      <div class="dots">${dots}</div>
    </div>
    ${h.fotosFonte?`<div class="src-note">📷 ${h.fotosFonte}</div>`:''}
    <div class="hotel-body">
      <h3>${h.nome} <span class="stars">${stars(h.estrelas)}</span></h3>
      <div class="addr">📍 ${h.endereco}</div>
      <table class="rooms"><thead><tr><th>Quarto</th><th>Plano</th><th>Restrições</th></tr></thead><tbody>${rooms}</tbody></table>
    </div>
    ${taBlock}
  </div>`;
}

function buildMapaRota(m){
  const W=430,H=300,{lon0,lon1,lat0,lat1}=m.escala;
  const px=l=>((l-lon0)/(lon1-lon0))*W, py=l=>((lat0-l)/(lat0-lat1))*H;
  const pts=m.pontos.map(p=>({...p,x:px(p.lon),y:py(p.lat)}));
  let paths="";for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1];const mx=(a.x+b.x)/2,my=(a.y+b.y)/2-26;paths+=`<path d="M${a.x} ${a.y} Q${mx} ${my} ${b.x} ${b.y}" fill="none" stroke="#3a7ca5" stroke-width="2.2" stroke-dasharray="5 4"/>`;}
  const dots=pts.map((p,i)=>`<circle cx="${p.x}" cy="${p.y}" r="5" fill="${i===0?'#e0a52e':(i===pts.length-1?'#25d366':'#16295c')}" stroke="#fff" stroke-width="1.6"/><text x="${p.x}" y="${p.y-9}" font-family="Arial" font-size="10.5" font-weight="700" fill="#0e1c42" text-anchor="middle">${p.nome}</text>`).join("");
  return `<div class="card map-card"><div class="cap">${m.titulo}</div><svg viewBox="0 0 ${W} ${H}"><rect width="${W}" height="${H}" rx="12" fill="#e9eef5"/>${paths}${dots}</svg></div>`;
}

// Carrossel de fotos do hotel — usado no orçamento completo e na cotação só de hospedagem.
window._carouselTimers = window._carouselTimers || {};
function initCarousels(){
  window._ci=window._ci||{};
  window.slide=(dir,idx)=>{
    const car=document.getElementById('carousel'+(idx||0)); if(!car)return;
    const tr=car.querySelector('.track'), dots=[...car.querySelectorAll('.dots i')], n=dots.length||1;
    window._ci[idx]=((window._ci[idx]||0)+dir+n)%n;
    tr.style.transform=`translateX(-${window._ci[idx]*100}%)`;
    dots.forEach((x,i)=>x.classList.toggle('on',i===window._ci[idx]));
  };
  document.querySelectorAll('.carousel').forEach(car=>{
    const idx=+car.dataset.idx||0; window._ci[idx]=0;
    const dots=[...car.querySelectorAll('.dots i')];
    dots.forEach(x=>x.addEventListener('click',()=>{
      window._ci[idx]=+x.dataset.i;
      car.querySelector('.track').style.transform=`translateX(-${window._ci[idx]*100}%)`;
      dots.forEach((y,i)=>y.classList.toggle('on',i===window._ci[idx]));
    }));
    // a página pode re-renderizar (fotos/mapas chegando aos poucos); sem isto, cada
    // re-render somava um novo intervalo e o carrossel acabava passando cada vez mais rápido.
    if(window._carouselTimers[idx]) clearInterval(window._carouselTimers[idx]);
    if(dots.length>1){ const CARROSSEL_MS=6000; // tempo de troca das fotos do hotel (ms)
      window._carouselTimers[idx]=setInterval(()=>window.slide(1,idx),CARROSSEL_MS); }
  });
}

function normTxt(s){ return (s||'').toString().toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim(); }
function lookupAirport(nome){
  const up=(nome||'').toUpperCase();
  const cod=/\(([A-Z]{3})\)/.exec(up);
  if(cod && AIRPORTS_DB[cod[1]]) return AIRPORTS_DB[cod[1]];
  const n=normTxt(nome);
  if(AIRPORTS_DB[n]) return AIRPORTS_DB[n];
  for(const k in AIRPORTS_DB){ if(k.length>=4 && n.indexOf(k)>=0) return AIRPORTS_DB[k]; }
  return null;
}
function pontosFromRota(rota){
  if(!rota) return [];
  return rota.split(/→|->/).map(x=>x.trim()).filter(Boolean).map(nome=>({nome}));
}
// Extrai a(s) cidade(s)/aeroporto(s) de conexão do texto livre do trecho
// (ex.: "Conexão em Guarulhos · GRU (1h55m)" ou "Conexões em Guarulhos (GRU) e Bogotá (BOG)").
// Sem isso, o mapa desenhava uma linha reta origem→destino como se o voo fosse direto.
function pontosDeConexao(conexaoTxt){
  const out=[];
  if(!conexaoTxt || /\bdireto\b/i.test(conexaoTxt)) return out;
  const re=/([A-Za-zÀ-ÖØ-öø-ÿ\s]+?)\s*(?:·|\()\s*([A-Z]{3})\)?/g;
  let m;
  while((m=re.exec(conexaoTxt))){
    const cidade=(m[1]||'')
      .replace(/conex(ão|ões|ao|oes)/gi,'')
      .replace(/\bem\b/gi,'')
      .replace(/\bvia\b/gi,'')
      .replace(/^\s*e\s+/i,'')
      .replace(/\s{2,}/g,' ')
      .trim();
    const iata=m[2];
    out.push({nome:(cidade?cidade+' ':'')+'('+iata+')'});
  }
  if(!out.length){
    const codes=conexaoTxt.match(/\b[A-Z]{3}\b/g)||[];
    codes.forEach(c=>out.push({nome:'('+c+')'}));
  }
  return out;
}
// Monta a rota completa (origem [+ conexões] + destino) direto do trecho real da cotação,
// em vez de depender só do campo solto "mapaVoo" da extração (que às vezes só traz 2 pontos).
function pontosFromTrecho(trecho){
  if(!trecho) return [];
  const pts=[];
  if(trecho.de||trecho.deCidade) pts.push({nome:`${trecho.deCidade||trecho.de} (${trecho.de||''})`.replace(' ()','')});
  pts.push(...pontosDeConexao(trecho.conexao));
  if(trecho.para||trecho.paraCidade) pts.push({nome:`${trecho.paraCidade||trecho.para} (${trecho.para||''})`.replace(' ()','')});
  return pts;
}
function initMaps(){
  const OSM=()=>L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18});
  async function geocodePonto(q){
    try{
      const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(q)}`);
      const a=await r.json();
      if(a&&a[0]) return { lat:+a[0].lat, lon:+a[0].lon };
    }catch(e){}
    return null;
  }
  async function routeMap(id,pts,color){
    const el=document.getElementById(id); if(!el)return;
    // a extração às vezes não traz lat/lon (nem sempre nem pontos) — completamos:
    // 1) por uma base própria de aeroportos/cidades (sem depender de rede);
    // 2) senão, geocodificando pelo código IATA ou nome do ponto.
    const completos=[];
    for(const p of (pts||[])){
      if(p && isFinite(p.lat) && isFinite(p.lon) && (p.lat||p.lon)){ completos.push(p); continue; }
      const nome=(p&&p.nome)||'';
      if(!nome) continue;
      const hit=lookupAirport(nome);
      if(hit){ completos.push({...p, nome, lat:hit[0], lon:hit[1]}); continue; }
      const m2=/\(([A-Z]{3})\)/.exec(nome.toUpperCase());
      const q=m2?`${m2[1]} airport`:`${nome}, Brasil`;
      const g=await geocodePonto(q);
      if(g) completos.push({...p, nome, lat:g.lat, lon:g.lon});
    }
    if(completos.length<2){ el.innerHTML='<div style="padding:24px;color:#6b7280;font-size:13px;text-align:center">Não foi possível localizar todos os pontos da rota.</div>'; return; }
    const m=L.map(id,{zoomControl:false,scrollWheelZoom:false,dragging:false,doubleClickZoom:false,attributionControl:false});
    OSM().addTo(m);
    const ll=completos.map(p=>[p.lat,p.lon]);
    L.polyline(ll,{color,weight:3,dashArray:'6 6'}).addTo(m);
    completos.forEach(p=>L.circleMarker([p.lat,p.lon],{radius:5,color:'#fff',weight:2,fillColor:color,fillOpacity:1}).addTo(m).bindTooltip(p.nome,{permanent:true,direction:'top',className:'maptip'}));
    m.fitBounds(ll,{padding:[36,36]});
    // a seção pode estar dentro de um container que ainda não tinha o tamanho final
    // no instante da criação do mapa (layout ainda assentando) — isso deixava o
    // mapa cortado/deslocado. Forçamos o Leaflet a recalcular o tamanho depois.
    setTimeout(()=>{ m.invalidateSize(); m.fitBounds(ll,{padding:[36,36]}); }, 300);
  }
  const trIda=(D.voos&&D.voos[0]&&(D.voos[0].trechos||[]).find(t=>t.tipo==='ida'))||null;
  const trVolta=(D.voos&&D.voos[0]&&(D.voos[0].trechos||[]).find(t=>t.tipo==='volta'))||null;
  if((D.mapaVoo&&D.mapaVoo.ida) || trIda){
    const ptsTrecho=pontosFromTrecho(trIda);
    const pts = ptsTrecho.length>=2 ? ptsTrecho
      : (D.mapaVoo&&D.mapaVoo.ida&&D.mapaVoo.ida.pontos&&D.mapaVoo.ida.pontos.length>=2) ? D.mapaVoo.ida.pontos
      : pontosFromRota(D.mapaVoo&&D.mapaVoo.ida&&D.mapaVoo.ida.rota);
    routeMap('mapIda', pts, '#3a7ca5');
  }
  if((D.mapaVoo&&D.mapaVoo.volta) || trVolta){
    const ptsTrecho=pontosFromTrecho(trVolta);
    const pts = ptsTrecho.length>=2 ? ptsTrecho
      : (D.mapaVoo&&D.mapaVoo.volta&&D.mapaVoo.volta.pontos&&D.mapaVoo.volta.pontos.length>=2) ? D.mapaVoo.volta.pontos
      : pontosFromRota(D.mapaVoo&&D.mapaVoo.volta&&D.mapaVoo.volta.rota);
    routeMap('mapVolta', pts, '#c98f1e');
  }

  // Localização real de cada hotel
  (D.hoteis||[]).forEach((h,i)=>{
    const el=document.getElementById('hotelmap'+i); if(!el)return;
    const show=(lat,lon)=>{ const hm=L.map('hotelmap'+i,{scrollWheelZoom:false}).setView([lat,lon],15);
      OSM().addTo(hm); L.marker([lat,lon]).addTo(hm).bindPopup(h.nome).openPopup();
      setTimeout(()=>{ hm.invalidateSize(); hm.setView([lat,lon],15); }, 300); };
    const g=h.geo;
    if(g && g.lat && g.lon){ show(g.lat,g.lon); return; }
    el.innerHTML='<div style="padding:24px;color:#6b7280;font-size:13px;text-align:center">Localizando o hotel…</div>';
    const partes=[h.nome, h.endereco, h.cidade].filter(Boolean);
    const temPais=/brasil|brazil/i.test(partes.join(' '));
    const q=partes.join(', ')+(temPais?'':', Brasil');
    fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(q)}`)
      .then(r=>r.json()).then(a=>{ if(a&&a[0]){ el.innerHTML=''; show(+a[0].lat,+a[0].lon); }
        else{ el.innerHTML='<div style="padding:24px;color:#6b7280;font-size:13px;text-align:center">Localização indisponível.</div>'; } })
      .catch(()=>{ el.innerHTML='<div style="padding:24px;color:#6b7280;font-size:13px;text-align:center">Não foi possível carregar o mapa.</div>'; });
  });
}

// roteador único: mantém o layout certo mesmo após carregar fotos/mapas
let _heroCarouselStarted=false;
function initHeroCarousel(){
  if(_heroCarouselStarted) return;
  _heroCarouselStarted=true;
  let i=0;
  setInterval(()=>{
    const slides=document.querySelectorAll('.hero-slide');
    if(slides.length<=1) return;
    i=(i+1)%slides.length;
    slides.forEach((s,k)=>s.classList.toggle('active',k===i));
  }, 5000);
}
function renderAll(){
  if(_TIPO==='voo') renderVoo();
  else if(_TIPO==='hotel') renderHotel();
  else render();
  initCarousels();
  initHeroCarousel();
  if(window.L){initMaps();}else{window.addEventListener('load',initMaps);}
}
renderAll();

// ?print=1 na URL -> baixa o PDF direto
if(/[?&]print=1/.test(location.search)){ setTimeout(baixarPdf, 800); }

// Puxa fotos, localização e dados do hotel em tempo real (via seu backend Hotelbeds)
async function loadHotelbeds(){
  if(!CONFIG.API_BASE||!CONFIG.hotelCode)return;
  try{
    const r=await fetch(CONFIG.API_BASE.replace(/\/$/,'')+'/api/hotel?code='+encodeURIComponent(CONFIG.hotelCode)+'&lang=POR');
    if(!r.ok)return; const d=await r.json();
    if(d.images&&d.images.length)D.hotel.fotos=d.images;
    if(d.name)D.hotel.nome=d.name;
    if(d.address)D.hotel.endereco=d.address+(d.city?(' · '+d.city):'');
    if(d.stars)D.hotel.estrelas=d.stars;
    if(d.coordinates&&d.coordinates.lat)D.hotel.geo={lat:+d.coordinates.lat,lon:+d.coordinates.lon};
    if(d.images&&d.images.length&&!D.fotoEscolhida)D.hero.imagem=d.images[0];
    D.hotel.fotosFonte="Fotos e localização em tempo real · Hotelbeds Content API";
    renderAll();
  }catch(e){console.warn('Hotelbeds:',e);}
}
loadHotelbeds();

// Fotos, localização e avaliações REAIS do hotel a partir do NOME (via Google Places no seu backend).
async function loadHotelInfo(){
  if(!D.hoteis || !D.hoteis.length) return;
  const base=(CONFIG.API_BASE||location.origin).replace(/\/$/,''); // usa sempre o próprio backend
  await Promise.all(D.hoteis.map(async h=>{
    if(!h.nome) return;
    try{
      const q=encodeURIComponent(`${h.nome} ${h.endereco||''}`);
      const r=await fetch(base+'/api/hotel-photos?q='+q);
      if(!r.ok){ let corpo=''; try{corpo=await r.text();}catch(e2){} console.warn('hotel-photos falhou:',r.status,corpo); return; }
      const d=await r.json();
      if(d.photoRefs&&d.photoRefs.length){
        h.fotos=d.photoRefs.map(ref=>base+'/api/place-photo?ref='+encodeURIComponent(ref));
        h.fotosFonte="Fotos, avaliações e localização reais do hotel";
      }
      if(d.coordinates&&d.coordinates.lat)h.geo={lat:+d.coordinates.lat,lon:+d.coordinates.lon};
      h.tripadvisor=h.tripadvisor||{};
      if(d.rating)h.tripadvisor.nota=d.rating;
      if(d.reviewsCount)h.tripadvisor.avaliacoes=d.reviewsCount;
      if(d.reviews&&d.reviews.length)h.tripadvisor.resenhas=d.reviews;
    }catch(e){console.warn('hotel-photos:',e);}
  }));
  D.hotel=D.hoteis[0];
  renderAll();
}
loadHotelInfo();

// Foto turística da cidade/destino na capa (Unsplash via backend)
async function loadCityPhoto(){
  if(_ENXUTO)return; // só-voo não usa foto de cidade
  if(D.fotoEscolhida&&D.hero&&D.hero.imagem)return; // foto escolhida manualmente no extrator
  const dest=D.destinoBusca || (D.resumo&&(D.resumo.find(x=>x.k==='Destino')||{}).v) || D.destinoResumo || (D.hero&&D.hero.titulo) || '';
  if(!dest)return;
  // alternativas: país (bom para roteiros com várias cidades no exterior) e o destino resumido
  const alts=[D.pais, D.destinoMensagem, (D.destinoResumo||'').split(',')[0]].filter(Boolean).join(',');
  try{
    const base=(CONFIG.API_BASE||location.origin).replace(/\/$/,'');
    const r=await fetch(base+'/api/city-photo?q='+encodeURIComponent(dest)+(alts?'&alt='+encodeURIComponent(alts):''));
    if(!r.ok)return; const d=await r.json();
    if(d.imagem){ D.hero.imagem=d.imagem; render(); }
  }catch(e){console.warn('city-photo:',e);}
}
loadCityPhoto();
